<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First of all… — Chouchou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  html, body { height:100%; }
  body.gate-page {
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% 20%, #12335c 0%, #0a1f3d 45%, #07152e 100%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }
  .gate-stars {
    position:fixed; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.5), transparent),
      radial-gradient(2px 2px at 30% 70%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,.5), transparent);
    opacity:.8;
  }
  .gate-wrap {
    position:relative;
    z-index:2;
    max-width:560px;
    margin:0 auto;
    padding:40px 24px;
    text-align:center;
  }
  .gate-wrap .eyebrow { opacity:.75; letter-spacing:.08em; text-transform:uppercase; font-size:.8rem; margin-bottom:14px; }
  .gate-wrap h1 {
    font-family:"Cormorant Garamond", serif;
    font-size:clamp(2.1rem, 6vw, 3.1rem);
    line-height:1.25;
    margin:0 0 10px;
  }
  .gate-wrap h1 em { font-style:italic; opacity:.9; }
  .gate-sub { opacity:.75; margin-bottom:44px; font-size:1rem; }
  .gate-buttons {
    display:flex; gap:20px; justify-content:center; align-items:center; flex-wrap:wrap;
    min-height:70px;
  }
  .gate-yes {
    border:0; border-radius:999px; padding:16px 34px; font:inherit; font-size:1.05rem; font-weight:600;
    cursor:pointer; background:#fff; color:#0a1f3d;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:transform .2s ease;
  }
  .gate-yes:hover { transform:scale(1.06); }
  .gate-no {
    border:1px solid rgba(255,255,255,.4); border-radius:999px; padding:16px 34px; font:inherit; font-size:1.05rem;
    cursor:pointer; background:rgba(255,255,255,.08); color:#fff;
    user-select:none; -webkit-tap-highlight-color:transparent;
    z-index:5;
  }
  #gateToast {
    position:fixed; left:50%; bottom:48px; transform:translate(-50%, 20px);
    background:rgba(255,255,255,.95); color:#0a1f3d; padding:12px 22px; border-radius:999px;
    font-weight:600; font-size:.95rem; box-shadow:0 12px 30px rgba(0,0,0,.3);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:20;
  }
  #gateToast.show { opacity:1; transform:translate(-50%, 0); }
  .gate-moon { position:fixed; top:60px; right:60px; font-size:2.4rem; opacity:.5; z-index:1; }
</style>
</head>
<body class="gate-page">
  <div class="gate-stars"></div>
  <div class="gate-moon">☾</div>

  <div class="gate-wrap">
    <p class="eyebrow">Asslemaa Habibiii... First of all…</p>
    <h1>Do you want to be my man?<br><em>My only man.</em></h1>
    <p class="gate-sub">(there's only one right answer here 😌)</p>

    <div class="gate-buttons">
      <button id="gateYes" class="gate-yes" type="button">Yes ♡</button>
      <button id="gateNo" class="gate-no" type="button">No</button>
    </div>
  </div>

  <div id="gateToast">Heeyy bech njii nkasserlk rassek raaw!!! 👀</div>

  <script>
    (function () {
      const noBtn = document.getElementById('gateNo');
      const yesBtn = document.getElementById('gateYes');
      const toast = document.getElementById('gateToast');
      const noTexts = ["No", "Nope", "Try again?", "Nice try 😏", "Not an option", "Hmm no", "Still no", "Keep trying 😅"];
      let attempts = 0;
      let toastTimer = null;

      function moveNoButton() {
        const rect = noBtn.getBoundingClientRect();
        const margin = 16;
        const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
        const maxY = Math.max(margin, window.innerHeight - rect.height - margin);
        const newX = margin + Math.random() * (maxX - margin);
        const newY = margin + Math.random() * (maxY - margin);

        noBtn.style.position = 'fixed';
        noBtn.style.left = newX + 'px';
        noBtn.style.top = newY + 'px';
        noBtn.style.margin = '0';
        noBtn.style.transition = 'left .22s ease, top .22s ease, transform .2s ease';
      }

      function dodge(e) {
        e.preventDefault();
        attempts++;
        moveNoButton();
        noBtn.textContent = noTexts[Math.min(attempts, noTexts.length - 1)];

        if (attempts >= 4) {
          showToast();
        }
      }

      function showToast() {
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
      }

      // Desktop: flee before the click even lands
      noBtn.addEventListener('pointerenter', dodge);
      // Mobile / fallback: flee on the initial touch/press
      noBtn.addEventListener('pointerdown', dodge);
      // Safety net: never actually let it register as a click
      noBtn.addEventListener('click', (e) => e.preventDefault());

      yesBtn.addEventListener('click', function () {
        window.location.href = 'index.html';
      });
    })();
  </script>

  <script src="js/main.js"></script>
</body>
</html>
