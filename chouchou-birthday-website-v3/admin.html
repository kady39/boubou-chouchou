<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boubou's Private Ocean Log</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background:#071a30; color:#fff; min-height:100vh; }
    .admin-wrap { max-width:1050px; margin:auto; padding:70px 20px; }
    .panel { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:24px; padding:25px; margin-bottom:22px; }
    input, button { font:inherit; }
    input { width:100%; box-sizing:border-box; padding:12px; border-radius:12px; border:0; margin:7px 0 12px; }
    button { padding:11px 17px; border:0; border-radius:999px; cursor:pointer; }
    .hidden { display:none; }
    .answer { border-top:1px solid rgba(255,255,255,.12); padding:18px 0; }
    .answer:first-child { border-top:0; }
    .meta { opacity:.7; font-size:.9rem; }
    .answer-text { white-space:pre-wrap; line-height:1.65; margin-top:8px; }
    .toolbar { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
    #status { min-height:24px; opacity:.85; }
  </style>
</head>
<body>
  <main class="admin-wrap">
    <section id="login-panel" class="panel">
      <p class="eyebrow">Private area</p>
      <h1>Boubou's Ocean Log 🌊</h1>
      <p>This page is for your eyes only.</p>
      <form id="login-form">
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Enter the log</button>
      </form>
      <p id="login-status"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="panel toolbar">
        <div>
          <p class="eyebrow">Private answers</p>
          <h1>What he left in the bottles ♡</h1>
        </div>
        <button id="logout">Log out</button>
      </div>
      <div id="status" class="panel">Loading…</div>
      <div id="answers" class="panel"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
